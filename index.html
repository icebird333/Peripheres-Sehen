<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Peripheres Tischtennis-Training V7</title><style>*{box-sizing:border-box}body{margin:0;background:#101419;color:white;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}#field{position:fixed;inset:0;overflow:hidden}#ball{position:absolute;border-radius:50%;display:none;pointer-events:none;box-shadow:inset -5px -6px 9px #0005,inset 4px 4px 7px #fff5}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:35px;height:35px;pointer-events:none}#cross:before,#cross:after{content:"";position:absolute;background:var(--cross-color,#ffdc48)}#cross:before{width:1px;height:35px;left:17px}#cross:after{height:1px;width:35px;top:17px}button,select,input{font:inherit}button{border:0;border-radius:9px;padding:10px 12px;background:#2877b5;color:white;cursor:pointer;touch-action:manipulation}button:active{background:#5a9dce}#ackButton{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;min-height:54px;min-width:118px;font-size:17px}#panel{position:fixed;top:8px;left:8px;right:8px;z-index:5;padding:10px;border-radius:12px;background:#192630f2;max-height:40vh;overflow:auto}#controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin-top:10px}label{font-size:12px;display:flex;flex-direction:column;gap:5px}input[type=range]{width:100%}#status{font-variant-numeric:tabular-nums}#toggle{position:fixed;right:8px;top:8px;z-index:8;padding:9px 12px;font-size:13px}#panel{padding-right:10px}#controls{padding-right:0}#notice{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);padding:8px;background:#192630c9;border-radius:8px;text-align:center;pointer-events:none;min-width:200px}#panel.hidden{display:none}#panel{top:52px;max-height:42vh}#notice{bottom:calc(75px + env(safe-area-inset-bottom));font-size:13px}#controls{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:7;display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding-right:175px;min-height:34px}#controls button{font-size:12px;padding:7px 9px;border-radius:7px;min-height:32px}#status{font-size:12px;white-space:nowrap;background:#192630df;padding:7px 8px;border-radius:7px}#toggle{top:calc(8px + env(safe-area-inset-top));font-size:12px;padding:8px 9px}#panel{top:calc(58px + env(safe-area-inset-top));max-height:40vh}#settings{margin-top:0}@media(max-width:650px){#controls{padding-right:125px}#status{font-size:11px}#toggle{max-width:122px}} </style></head><body><div id="field"><div id="ball"></div><div id="cross"></div><button id="ackButton" type="button">Erkannt ✓</button></div><div id="controls"><button id="start" type="button">Start</button><button id="pause" type="button">Pause</button><button id="reset" type="button">Neustart</button><span id="status">00:00 · 0 erkannt · 0 gezeigt</span></div><div id="panel"><div id="settings"><label>Darstellung<select id="mode"><option value="gray">Graustufen</option><option value="color">Zufällige Farben</option></select></label><label>Sichtbarkeit <output id="durv">800 ms</output><input id="dur" type="range" min="100" max="3000" step="100" value="800"></label><label>Pause zwischen Bällen <output id="gapv">900 ms</output><input id="gap" type="range" min="100" max="4000" step="100" value="900"></label><label>Ballgröße <output id="sizev">42 px</output><input id="size" type="range" min="12" max="90" value="42"></label><label>Abstand zur Mitte <output id="distv">70 %</output><input id="dist" type="range" min="30" max="95" value="70"></label><label>Graukontrast <output id="contrastv">70 %</output><input id="contrast" type="range" min="10" max="100" value="70"></label><label>Quittierung im Zentrum<select id="ack"><option value="on">Ein</option><option value="off">Aus</option></select></label><label>Hintergrund<select id="bg"><option value="dark">Dunkel</option><option value="mid">Mittelgrau</option><option value="light">Hell</option></select></label></div></div><button id="toggle" type="button">Einstellungen ausblenden</button><div id="notice">Fadenkreuz fixieren und Start drücken</div><div id="debug" style="position:fixed;bottom:10px;left:10px;z-index:10;color:#ffe16b;font-size:12px">JavaScript wird geladen …</div><script>
window.onerror=function(msg){document.getElementById('debug').textContent='JS-Fehler: '+msg;};
(function(){'use strict';
function el(id){return document.getElementById(id)}
var running=false,paused=false,elapsed=0,shown=0,hits=0,visible=false,acknowledged=false,phaseTimer=null,clockTimer=null,startedAt=0;
function value(id){return Number(el(id).value)}
function status(){var seconds=Math.floor(elapsed/1000);el('status').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')+' · '+hits+' erkannt · '+shown+' gezeigt'}
function clearPhase(){if(phaseTimer!==null){clearTimeout(phaseTimer);phaseTimer=null}}
function hideBall(){el('ball').style.display='none';visible=false}

 function placeBall(){
  if(!running||paused)return;
  var b=el('ball'),size=value('size'),w=window.innerWidth,h=window.innerHeight;
  var panel=el('panel'),panelRect=panel.getBoundingClientRect();
  var controlsBottom=el('controls').getBoundingClientRect().bottom;
  var safeTop=Math.ceil(Math.max(controlsBottom,panel.classList.contains('hidden')?0:panelRect.bottom))+14;
  var ackRect=el('ackButton').getBoundingClientRect();
  var safeBottom=Math.min(h-85,el('ack').value==='on'?ackRect.top-12:h-85);
  var pad=14, minX=pad,maxX=w-size-pad,minY=safeTop,maxY=safeBottom-size;
  if(maxX<minX||maxY<minY){hideBall();phaseTimer=setTimeout(placeBall,250);return;}
  var cx=w/2,cy=h/2,rx=Math.max(1,w/2-size/2-pad),ry=Math.max(1,h/2-size/2-pad);
  var target=value('dist')/100, best=null,bestScore=Infinity;
  for(var i=0;i<120;i++){
   var x=minX+Math.random()*(maxX-minX),y=minY+Math.random()*(maxY-minY);
   var norm=Math.sqrt(Math.pow((x+size/2-cx)/rx,2)+Math.pow((y+size/2-cy)/ry,2))/Math.SQRT2;
   var score=Math.abs(norm-target);
   if(score<bestScore){bestScore=score;best={x:x,y:y};}
  }
  b.style.left=best.x+'px';b.style.top=best.y+'px';
  b.style.width=size+'px';b.style.height=size+'px';
  if(el('mode').value==='color'){b.style.background='hsl('+Math.floor(Math.random()*360)+',85%,60%)'}
  else{var c=value('contrast')/100,g=Math.round(115+(Math.random()-.5)*220*c);g=Math.max(15,Math.min(240,g));b.style.background='rgb('+g+','+g+','+g+')'}
  b.style.display='block';visible=true;acknowledged=false;shown++;status();
  phaseTimer=setTimeout(function(){hideBall();phaseTimer=setTimeout(placeBall,value('gap'))},value('dur'))
 }function clock(){if(running&&!paused){elapsed+=Date.now()-startedAt;startedAt=Date.now();status()}}
function begin(){if(!running){running=true;paused=false;elapsed=0;shown=0;hits=0;status();clearPhase();hideBall();startedAt=Date.now();placeBall()}else if(paused){resume()}el('notice').textContent='Training läuft – Fadenkreuz fixieren';el('pause').textContent='Pause'}
function resume(){if(!running||!paused)return;paused=false;startedAt=Date.now();placeBall();el('pause').textContent='Pause';el('notice').textContent='Training läuft'}
function pause(){if(!running)return;if(paused){resume();return}clock();paused=true;clearPhase();hideBall();el('pause').textContent='Weiter';el('notice').textContent='Pausiert'}
function reset(){clearPhase();running=false;paused=false;elapsed=0;shown=0;hits=0;hideBall();status();el('pause').textContent='Pause';el('notice').textContent='Zurückgesetzt – Start drücken'}
function sync(){['dur','gap','size','dist','contrast'].forEach(function(id){el(id+'v').textContent=el(id).value+((id==='dur'||id==='gap')?' ms':id==='size'?' px':' %')});el('ackButton').style.display=el('ack').value==='on'?'block':'none';document.body.style.background=({dark:'#101419',mid:'#777777',light:'#e2e2e2'})[el('bg').value];el('cross').style.setProperty('--cross-color',el('bg').value==='light'?'#000000':'#ffdc48')}
el('start').addEventListener('click',begin);el('pause').addEventListener('click',pause);el('reset').addEventListener('click',reset);el('ackButton').addEventListener('click',function(){if(running&&!paused&&visible&&!acknowledged){hits++;acknowledged=true;status()}});['mode','dur','gap','size','dist','contrast','ack','bg'].forEach(function(id){el(id).addEventListener('input',sync);el(id).addEventListener('change',sync)});el('toggle').addEventListener('click',function(){var hidden=el('panel').classList.toggle('hidden');el('toggle').textContent=hidden?'Einstellungen anzeigen':'Einstellungen ausblenden'});clockTimer=setInterval(clock,100);sync();status();el('debug').textContent='Steuerung bereit ✓';setTimeout(function(){el('debug').style.display='none'},1800);
})();
</script></body></html>
